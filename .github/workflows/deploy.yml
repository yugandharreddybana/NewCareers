name: Deploy

on:
  push:
    branches:
      - main
      - develop

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: mvn -B verify

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test --if-present
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ github.ref == 'refs/heads/main' && secrets.VITE_API_URL_PROD || secrets.VITE_API_URL_STAGING }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_STRIPE_PUBLIC_KEY: ${{ github.ref == 'refs/heads/main' && secrets.VITE_STRIPE_PUBLIC_KEY_PROD || secrets.VITE_STRIPE_PUBLIC_KEY_STAGING }}

  test-middleware:
    name: Test Middleware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: middleware/package-lock.json
      - run: npm ci
      - run: npm test

  build-docker:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - test-frontend
      - test-middleware
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t careerops-backend:${{ github.sha }} backend/

  deploy-staging:
    name: Deploy Staging (Railway)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Trigger Railway deploy hook
        run: curl -fsS -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_STAGING }}"

  deploy-production:
    name: Deploy Production (Railway)
    runs-on: ubuntu-latest
    needs: build-docker
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Railway deploy hook
        run: curl -fsS -X POST "${{ secrets.RAILWAY_DEPLOY_HOOK_PROD }}"
