# Local development — offline-friendly H2 by default; mock Stripe; plan limits bypassed.
spring:
  profiles:
    include: cache
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/careerops-dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY;INIT=RUNSCRIPT FROM 'classpath:h2-init.sql'}
    driver-class-name: ${DATABASE_DRIVER:org.h2.Driver}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
    hikari:
      schema: PUBLIC
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        default_schema: careerops
  sql:
    init:
      data-locations: classpath:h2-dev-seed.sql
      mode: always
  flyway:
    enabled: ${FLYWAY_ENABLED:false}

auth:
  login:
    word-captcha:
      required: false

resend:
  dev-mode: true

ratelimit:
  require-shared-store: false

cors:
  allowed:
    origins: http://localhost:4000,http://localhost:5173,http://localhost:5174,http://localhost:3000

scraper:
  auto-start: ${SCRAPER_AUTO_START:true}

jobs:
  live:
    simulation:
      enabled: true
  onboarding:
    heuristic-fallback: true

nvidia:
  max:
    concurrent: 2

permit:
  ingestion:
    enabled: ${PERMIT_INGESTION_ENABLED:false}

logging:
  level:
    com.careerops: DEBUG
