# Local development on Postgres (port 8080) — datasource comes from application.properties + repo .env.
# For offline H2 file DB, use the `test` profile (application-test.properties, port 8100).
# cache profile is activated via spring.profiles.include in application.properties (not here).
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

auth:
  login:
    word-captcha:
      required: false

resend:
  dev-mode: true

# Skip reCAPTCHA server verification locally (widget may still show when VITE_RECAPTCHA_SITE_KEY is set).
# Staging/prod always enforce when captcha.secret is configured.
captcha:
  dev-mode: true

stripe:
  mock-checkout-auto-activate: true

ratelimit:
  require-shared-store: false

cors:
  allowed:
    origins: http://localhost:4000,http://localhost:5173,http://localhost:5174,http://localhost:3000

scraper:
  auto-start: ${SCRAPER_AUTO_START:true}

jobs:
  nightly:
    catchup-on-startup: true
  live:
    simulation:
      enabled: true
  onboarding:
    heuristic-fallback: true

nvidia:
  max:
    concurrent: 2

permit:
  ingestion:
    enabled: ${PERMIT_INGESTION_ENABLED:false}

logging:
  level:
    com.careerops: DEBUG
