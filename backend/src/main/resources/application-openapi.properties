spring.datasource.url=jdbc:h2:mem:careerops_openapi;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;INIT=RUNSCRIPT FROM 'src/main/resources/h2-init.sql'
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.schema=PUBLIC

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=careerops
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=true
spring.flyway.schemas=careerops
spring.flyway.default-schema=careerops

spring.main.lazy-initialization=true
spring.mail.host=localhost
spring.mail.port=3025

cors.allowed.origins=http://localhost:4000,http://localhost:3000
app.internal.secret=openapi-internal-trust-secret-minimum-32-characters-long
app.master.kek=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
jwt.private-
jwt.public-
jwt.private-key-pem=${jwt.private-key}
jwt.public-key-pem=${jwt.public-key}

gemini.enabled=false
serpapi.api.key=openapi-serpapi-placeholder
