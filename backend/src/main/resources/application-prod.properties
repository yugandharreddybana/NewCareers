# ─── Production overrides ───────────────────────────────────
# Applied when SPRING_PROFILES_ACTIVE=prod

# Tighten logging — no debug/info noise in production
logging.level.root=WARN
logging.level.com.careerops=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.io.micrometer=WARN

# Expose only safe actuator endpoints in prod
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when_authorized

# Stronger HikariCP for prod (higher pool)
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10

# Larger Tomcat thread pool for prod
server.tomcat.threads.max=400
server.tomcat.threads.min-spare=40

# Disable Swagger in prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Hibernate — never allow DDL changes in prod
spring.jpa.hibernate.ddl-auto=validate

# Larger async pools for prod load
async.scraping.core-pool-size=16
async.scraping.max-pool-size=64
async.ai.core-pool-size=8
async.ai.max-pool-size=32
async.email.core-pool-size=4
async.email.max-pool-size=16
