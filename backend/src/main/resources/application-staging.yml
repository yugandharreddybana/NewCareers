# Staging — real Supabase + Redis; mock Stripe; plan limits enforced; CAPTCHA on.
spring:
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDIS_PASSWORD:}}

auth:
  login:
    word-captcha:
      required: true
  word-captcha:
    require-redis: true

captcha:
  secret: ${CAPTCHA_SECRET:}

ratelimit:
  require-shared-store: true

resend:
  dev-mode: false

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:https://staging.your-domain.com}

scraper:
  auto-start: false

permit:
  ingestion:
    enabled: false

jobs:
  live:
    simulation:
      enabled: false

logging:
  level:
    com.careerops: INFO
