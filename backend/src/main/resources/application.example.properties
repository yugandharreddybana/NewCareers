# ============================================================
# CareerOps Backend — configuration template (NO secret values)
# Copy repo-root .env from .env.example for local dev.
# Never put secrets in committed application*.properties files.
# ============================================================

server.port=${PORT:8080}
spring.application.name=careerops-backend
spring.config.import=optional:file:../.env[.properties]

# ─── Database — set DATABASE_* in .env ─────────────────────
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=careerops

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=careerops
spring.jpa.open-in-view=false
spring.flyway.schemas=careerops
spring.flyway.default-schema=careerops

# ─── Internal HMAC (middleware → Java) ─────────────────────
internal.trust.header=${INTERNAL_TRUST_HEADER:X-Internal-User-Id}
app.internal.secret=${APP_INTERNAL_SECRET:}

# ─── JWT RS256 — set JWT_PRIVATE_KEY_PEM / JWT_PUBLIC_KEY_PEM in .env ─
jwt.private-key-pem=${JWT_PRIVATE_KEY_PEM:}
jwt.public-key-pem=${JWT_PUBLIC_KEY_PEM:}
jwt.expiry.ms=${JWT_EXPIRY_MS:900000}

# ─── Field encryption — set APP_MASTER_KEK in .env (required) ─
app.master.kek=${APP_MASTER_KEK:}
app.encryption.key=${APP_ENCRYPTION_KEY:}

# ─── Optional API keys — set in .env when needed ───────────
supabase.url=${SUPABASE_URL:}
supabase.service.key=${SUPABASE_SERVICE_KEY:}
nvidia.api.key=${NVIDIA_API_KEY:}
anthropic.api.key=${ANTHROPIC_API_KEY:}
gemini.api.key=${GEMINI_API_KEY:}
serpapi.api.key=${SERPAPI_API_KEY:}
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
reed.api.key=${REED_API_KEY:}
resend.api.key=${RESEND_API_KEY:}
openai.api.key=${OPENAI_API_KEY:}

# ─── Application ───────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:4000}
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4000,http://localhost:5173}
