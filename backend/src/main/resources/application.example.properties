# ============================================================
# NewCareers Backend — Environment Variables Template
# Copy this file to application.properties and fill in values.
# NEVER commit application.properties with real keys to git.
# ============================================================

server.port=8080
spring.application.name=careerops-backend

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ─── Supabase Postgres ─────────────────────────────────────
# Find in: Supabase Dashboard → Settings → Database
spring.datasource.url=jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=<your-db-password>
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=careerops
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=careerops
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

spring.flyway.schemas=careerops
spring.flyway.default-schema=careerops

# ─── Internal Auth ─────────────────────────────────────────
# Must match Node middleware value exactly
internal.trust.header=X-Internal-User-Id
internal.trust.secret=<generate-with: openssl rand -hex 32>

# ─── JWT ───────────────────────────────────────────────────
# Base64-encoded PKCS#8 private key and SPKI public key for RS256.
jwt.private-key=<base64-pkcs8-private-key>
jwt.public-key=<base64-spki-public-key>
jwt.expiry.ms=900000


# ─── Supabase Storage ──────────────────────────────────────
# Find in: Supabase Dashboard → Settings → API
supabase.url=https://<project-ref>.supabase.co
supabase.service.key=<service-role-key-from-supabase-dashboard>
supabase.bucket.cv=user-cvs
supabase.bucket.application.cv=application-cvs
supabase.bucket.resume=resume-versions

# ─── Anthropic Claude API (PRIMARY AI ENGINE) ──────────────
# https://console.anthropic.com → API Keys
anthropic.api.key=sk-ant-...
anthropic.model=claude-opus-4-7
anthropic.max.tokens=8192
anthropic.max.tool.iterations=25
anthropic.call.timeout.seconds=120

# ─── SerpAPI (web_search inside skills) ────────────────────
# https://serpapi.com → Dashboard
# Free tier: 100 searches/month. Skills use this for salary & company research.
serpapi.api.key=<your-serpapi-key>
serpapi.monthly.limit=100

# ─── Gemini (job matching on delivery only) ────────────────
# https://aistudio.google.com → Get API Key
# Skills use Claude, not Gemini. Gemini only for bulk job→CV matching.
gemini.api.key=AIza...
gemini.model=gemini-1.5-flash
gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# ─── Skill Conversations ───────────────────────────────────
skill.conversation.expire.minutes=30

# ─── Skill Prompt Sources ──────────────────────────────────
skill.prompt.upstream.owner=andrew-shwetzer
skill.prompt.upstream.repo=career-ops-plugin
# Default fork for Layer 2 prompts (override with GITHUB_FORK_OWNER)
skill.prompt.fork.owner=yugandharreddybana
skill.prompt.fork.repo=career-ops-plugin
skill.prompt.github.commit-sha=ae447d7bf902da2a5cf4f22762c4e8dfdd8e6f9d
nvidia.max.concurrent=2
jobs.onboarding.heuristic-fallback=true

# ─── Job Sources ───────────────────────────────────────────
# Adzuna: https://developer.adzuna.com
adzuna.app.id=<adzuna-app-id>
adzuna.app.key=<adzuna-app-key>
# Keep gb as fallback; source logic auto-tries IE for Ireland profile locations.
adzuna.country.code=gb
adzuna.daily.limit=250
jobs.live.simulation.enabled=false

# Reed: https://www.reed.co.uk/developers/jobseeker
reed.api.key=<reed-api-key>

# ─── Google Sign-In ──────────────────────────────────────
# Google Cloud Console → OAuth 2.0 Client ID (Web application)
# Authorized JavaScript origins: http://localhost:5173, https://your-app.com
google.oauth.client-id=your-client-id.apps.googleusercontent.com

# ─── Email (Resend) ────────────────────────────────────────
# https://resend.com → API Keys
resend.api.key=re_...
resend.from=CareerOps <noreply@yourdomain.com>

# ─── Business Rules ────────────────────────────────────────
jobs.max.per.user.per.day=10
ai.daily.token.budget=500000
jobs.cron.daily.count=3
jobs.freshness.default.hours=96

# ─── Company career pages (Playwright sidecar) ───────────
# Auto-started by backend on local dev; use docker compose for containerized scraper.
scraper.base-url=${SCRAPER_BASE_URL:http://127.0.0.1:5500}
scraper.auto-start=${SCRAPER_AUTO_START:true}
scraper.startup-timeout-seconds=90
company.careers.cache-hours=6
company.careers.scan-cron=0 0 */6 * * *
company.careers.background-scan.enabled=true
company.careers.playwright-timeout-seconds=45

# ─── Application ───────────────────────────────────────────
app.base-url=http://localhost:4000
cors.allowed.origins=http://localhost:4000

logging.level.com.careerops=DEBUG

# ─── Actuator Management ────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when_authorized

