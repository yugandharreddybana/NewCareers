server.port=8080
server.servlet.context-path=/api/v1
spring.application.name=careerops-backend

# ─── Multipart / Body limits ────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB

# ─── GZIP HTTP Compression ──────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,text/css,application/javascript,text/javascript
server.compression.min-response-size=1024

# ─── HTTP/2 ─────────────────────────────────────────────────
server.http2.enabled=true

# ─── Tomcat Thread Pool Tuning ──────────────────────────────
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=5000
server.tomcat.keep-alive-timeout=30000
server.tomcat.max-keep-alive-requests=200

# ─── Default Spring Profiles ────────────────────────────────
spring.profiles.active=test

# ─── Supabase Postgres ──────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── HikariCP Connection Pool ─────────────────────────────────
spring.datasource.hikari.schema=careerops
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.pool-name=CareerOpsHikariPool
spring.datasource.hikari.register-mbeans=true
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=60000

# ─── JPA ────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=careerops
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.open-in-view=false

# ─── Flyway ─────────────────────────────────────────────────
spring.flyway.schemas=careerops
spring.flyway.default-schema=careerops
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.repair-on-migrate=false
spring.flyway.placeholders.currency_default=EUR
spring.flyway.placeholders.environment=${SPRING_PROFILES_ACTIVE:dev}

# ─── Spring Cache (Caffeine) ──────────────────────────────────
spring.cache.type=caffeine
spring.cache.cache-names=jobs,userProfile,jobStats,aiResult,sourceMetadata
spring.cache.caffeine.spec=maximumSize=2000,expireAfterWrite=300s

# ─── Async Executors ────────────────────────────────────────
async.scraping.core-pool-size=8
async.scraping.max-pool-size=32
async.scraping.queue-capacity=500
async.ai.core-pool-size=4
async.ai.max-pool-size=16
async.ai.queue-capacity=200
async.email.core-pool-size=2
async.email.max-pool-size=8
async.email.queue-capacity=100

# ─── Scraper Resilience (Batch 2) ─────────────────────────────
scraper.resilience.failure-threshold=5
scraper.resilience.open-duration-ms=120000
scraper.resilience.success-threshold=2
scraper.resilience.call-timeout-ms=30000
scraper.resilience.max-concurrent-domain=3
scraper.resilience.rate-limit-timeout-ms=5000

# ─── Scraper HTTP client pool ───────────────────────────────
scraper.http.max-connections=100
scraper.http.max-connections-per-host=20
scraper.http.connect-timeout-ms=5000
scraper.http.read-timeout-ms=20000
scraper.http.write-timeout-ms=10000
scraper.http.keep-alive-duration-seconds=60

# ─── Internal Auth ──────────────────────────────────────────
internal.trust.header=X-Internal-User-Id
internal.trust.secret=${INTERNAL_TRUST_SECRET:}
app.admin.user-ids=${APP_ADMIN_USER_IDS:}

# ─── JWT ────────────────────────────────────────────────────
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.expiry.ms=900000

# ─── Supabase Storage ───────────────────────────────────────
supabase.url=${SUPABASE_URL:}
supabase.service.key=${SUPABASE_SERVICE_KEY:}
supabase.anon.key=${SUPABASE_ANON_KEY:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
supabase.bucket.cv=user-cvs
supabase.bucket.application.cv=application-cvs
supabase.bucket.resume=resume-versions

# ─── NVIDIA NIM ────────────────────────────────────────────
nvidia.api.key=${NVIDIA_API_KEY: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}
nvidia.model=meta/llama-3.3-70b-instruct
nvidia.agent.model=${NVIDIA_AGENT_MODEL:meta/llama-3.3-70b-instruct}
nvidia.max.tokens=4096

# ─── Anthropic (rollback only) ───────────────────────────────
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-opus-4-7
anthropic.max.tokens=8192
anthropic.max.tool.iterations=25
anthropic.call.timeout.seconds=120
anthropic.direct.max.tokens=4096

# ─── SerpAPI ────────────────────────────────────────────────
serpapi.api.key=${SERPAPI_API_KEY:}
serpapi.monthly.limit=100

# ─── Gemini (rollback only) ────────────────────────────────
gemini.api.key=${GEMINI_API_KEY:}
gemini.stub=${GEMINI_STUB:false}
gemini.model=gemini-1.5-flash
gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# ─── Skill Conversations ────────────────────────────────────
skill.conversation.expire.minutes=30

# ─── Skill Prompt Sources ───────────────────────────────────
skill.prompt.upstream.owner=andrew-shwetzer
skill.prompt.upstream.repo=career-ops-plugin
skill.prompt.fork.owner=${GITHUB_FORK_OWNER:yugandharreddybana}
skill.prompt.fork.repo=${GITHUB_FORK_REPO:career-ops-plugin}
skill.prompt.github.commit-sha=ae447d7bf902da2a5cf4f22762c4e8dfdd8e6f9d

# ─── NVIDIA concurrency ─────────────────────────────────────
nvidia.max.concurrent=${NVIDIA_MAX_CONCURRENT:2}
jobs.onboarding.heuristic-fallback=${JOBS_ONBOARDING_HEURISTIC_FALLBACK:true}
jobs.onboarding.persist-discovery-pool=${JOBS_ONBOARDING_PERSIST_POOL:true}
jobs.onboarding.discovery-pool-cap=${JOBS_ONBOARDING_POOL_CAP:200}

# ─── Job Sources ────────────────────────────────────────────
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
adzuna.country.code=${ADZUNA_COUNTRY_CODE:gb}
adzuna.daily.limit=250
jobs.live.simulation.enabled=${JOBS_LIVE_SIMULATION_ENABLED:true}
reed.api.key=${REED_API_KEY:}

# ─── Google OAuth ───────────────────────────────────────────
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# ─── Email (Resend) ─────────────────────────────────────────
resend.api.key=${RESEND_API_KEY:}
resend.from=CareerOps <${RESEND_FROM_EMAIL:careerops@resend.dev}>
resend.template.id=${RESEND_TEMPLATE_ID:password-reset}

# ─── Business Rules ─────────────────────────────────────────
jobs.enforce-min-match-percent=${JOBS_ENFORCE_MIN_MATCH:false}
jobs.max.per.user.per.day=25
ai.daily.token.budget=${AI_DAILY_TOKEN_BUDGET:500000}
jobs.cron.daily.count=3
jobs.gemini.prerank.pool=25
jobs.freshness.default.hours=96

# ─── Company career pages ───────────────────────────────────
scraper.base-url=${SCRAPER_BASE_URL:http://127.0.0.1:5500}
scraper.auto-start=${SCRAPER_AUTO_START:true}
scraper.startup-timeout-seconds=90
company.careers.cache-hours=6
company.careers.scan-cron=0 0 */6 * * *
company.careers.background-scan.enabled=true
company.careers.playwright-timeout-seconds=45

# ─── App base URL ──────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:4000}

# ─── Actuator ───────────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,info,prometheus,loggers
management.endpoint.health.show-details=when_authorized
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99

# ─── Logging ────────────────────────────────────────────────
logging.level.com.careerops=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=WARN
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{correlationId}:%X{userId}]){cyan} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# ─── OpenAPI ────────────────────────────────────────────────
springdoc.api-docs.version=OPENAPI_3_1
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Jackson ────────────────────────────────────────────────
spring.jackson.deserialization.fail-on-trailing-tokens=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
