server.port=8080
server.servlet.context-path=/api/v1
spring.application.name=careerops-backend

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# 2.063 — Prevent OOM by capping JSON/form bodies
server.tomcat.max-http-form-post-size=1MB
server.tomcat.max-swallow-size=1MB

# ─── Default Spring Profiles ───────────────────────────────
# test = H2 in-memory on port 8100 with sample jobs (zero Postgres setup).
# dev  = real Postgres — copy application.example.properties + set SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=test

# ─── Supabase Postgres ─────────────────────────────────────
# 3.092 — Database Backup Schedule & Strategy:
#   - Frequency: Continuous Point-In-Time Recovery (PITR) with offsite daily snapshots.
#   - Retention: 30 days minimum retention.
#   - Verification: Monthly restore-test cron (executed on 1st at 04:00 Dublin time).
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=careerops
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.leak-detection-threshold=15000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=careerops
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

spring.flyway.schemas=careerops
spring.flyway.default-schema=careerops
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# 10.036 — Flyway repair configuration
spring.flyway.repair-on-migrate=false
# 10.043 — Flyway placeholder substitution
spring.flyway.placeholders.currency_default=EUR
spring.flyway.placeholders.environment=${SPRING_PROFILES_ACTIVE:dev}

# ─── Internal Auth ─────────────────────────────────────────
internal.trust.header=X-Internal-User-Id
internal.trust.secret=${INTERNAL_TRUST_SECRET:}
# Comma-separated list of UUIDs allowed to access /admin/** (Task 2.060)
app.admin.user-ids=${APP_ADMIN_USER_IDS:}

# ─── JWT ───────────────────────────────────────────────────
jwt.private-key=${JWT_PRIVATE_KEY:}
jwt.public-key=${JWT_PUBLIC_KEY:}
jwt.expiry.ms=900000

# ─── Supabase Storage ──────────────────────────────────────
supabase.url=${SUPABASE_URL:}
supabase.service.key=${SUPABASE_SERVICE_KEY:}
supabase.anon.key=${SUPABASE_ANON_KEY:}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
supabase.bucket.cv=user-cvs
supabase.bucket.application.cv=application-cvs
supabase.bucket.resume=resume-versions

# ─── NVIDIA NIM (PRIMARY AI ENGINE) ───────────────────────
# Replaces both Gemini (job matching) and Anthropic Claude (skills + agent loop)
# Get a free key at: https://build.nvidia.com
nvidia.api.key=${NVIDIA_API_KEY:}
nvidia.model=meta/llama-3.3-70b-instruct
nvidia.agent.model=meta/llama-3.1-405b-instruct
nvidia.max.tokens=4096

# ─── Anthropic Claude API (DEPRECATED — kept for rollback only) ────────────
# These keys are no longer actively used. ClaudeAgentService and ClaudeDirectService
# remain in the codebase but are not injected into any active service.
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-opus-4-7
anthropic.max.tokens=8192
anthropic.max.tool.iterations=25
anthropic.call.timeout.seconds=120
anthropic.direct.max.tokens=4096

# ─── SerpAPI (web_search inside skills) ────────────────────
serpapi.api.key=${SERPAPI_API_KEY:}
serpapi.monthly.limit=100

# ─── Gemini (DEPRECATED — kept for rollback only) ──────────
# GeminiService remains in the codebase but is no longer injected into active services.
gemini.api.key=${GEMINI_API_KEY:}
gemini.stub=${GEMINI_STUB:false}
gemini.model=gemini-1.5-flash
gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# ─── Skill Conversations ───────────────────────────────────
skill.conversation.expire.minutes=30

# ─── Skill Prompt Sources ──────────────────────────────────
# Layer 1: upstream; Layer 2: fork (default yugandharreddybana/career-ops-plugin); Layer 3: classpath bundle
skill.prompt.upstream.owner=andrew-shwetzer
skill.prompt.upstream.repo=career-ops-plugin
skill.prompt.fork.owner=${GITHUB_FORK_OWNER:yugandharreddybana}
skill.prompt.fork.repo=${GITHUB_FORK_REPO:career-ops-plugin}
skill.prompt.github.commit-sha=ae447d7bf902da2a5cf4f22762c4e8dfdd8e6f9d

# ─── NVIDIA concurrency (daily delivery + skills) ────────
nvidia.max.concurrent=${NVIDIA_MAX_CONCURRENT:2}
jobs.onboarding.heuristic-fallback=${JOBS_ONBOARDING_HEURISTIC_FALLBACK:true}

# ─── Job Sources ───────────────────────────────────────────
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
# Keep gb as safe default; AdzunaSource now auto-tries IE for Ireland profiles.
adzuna.country.code=${ADZUNA_COUNTRY_CODE:gb}
adzuna.daily.limit=250
jobs.live.simulation.enabled=${JOBS_LIVE_SIMULATION_ENABLED:true}

reed.api.key=${REED_API_KEY:}

# ─── Google Sign-In ──────────────────────────────────────
google.oauth.client-id=${GOOGLE_OAUTH_CLIENT_ID:}

# ─── Email (Resend) ────────────────────────────────────────
resend.api.key=${RESEND_API_KEY:}
resend.from=CareerOps <${RESEND_FROM_EMAIL:careerops@resend.dev}>   
resend.template.id=${RESEND_TEMPLATE_ID:password-reset}

# ─── Business Rules ────────────────────────────────────────
jobs.max.per.user.per.day=10
jobs.cron.daily.count=3
jobs.gemini.prerank.pool=25
jobs.freshness.default.hours=96

# ─── Application ───────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:4000}

# ─── Actuator Management ────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when_authorized

# ─── Logging ────────────────────────────────────────────────
logging.level.com.careerops=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{correlationId} - %X{userId}]){cyan} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# ─── OpenAPI 3.1 (Issue 2.074) ──────────────────────────────
springdoc.api-docs.version=OPENAPI_3_1
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ─── Jackson Security (Issue 2.077) ────────────────────────
spring.jackson.deserialization.fail-on-trailing-tokens=true

