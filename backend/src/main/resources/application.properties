server.port=8080
spring.application.name=careerops-backend

# ─────────────────────────────────────────────
# Supabase Postgres
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://db.YOUR-PROJECT.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=YOUR_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=career_operations

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=career_operations
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────
# Internal trust header (set same value in Node middleware)
# ─────────────────────────────────────────────
internal.trust.header=X-Internal-User-Id
internal.trust.secret=CHANGE_ME_LONG_RANDOM_STRING

# ─────────────────────────────────────────────
# JWT
# ─────────────────────────────────────────────
jwt.secret=CHANGE_ME_AT_LEAST_32_CHARS_LONG_RANDOM
jwt.expiry.ms=604800000

# ─────────────────────────────────────────────
# Supabase Storage
# ─────────────────────────────────────────────
supabase.url=https://YOUR-PROJECT.supabase.co
supabase.service.key=YOUR_SERVICE_ROLE_KEY
supabase.bucket.cv=user-cvs
supabase.bucket.application.cv=application-cvs

# ─────────────────────────────────────────────
# Anthropic Claude API  ← PRIMARY AI ENGINE
# Get key: https://console.anthropic.com
# ─────────────────────────────────────────────
anthropic.api.key=YOUR_ANTHROPIC_API_KEY
anthropic.model=claude-opus-4-5
anthropic.max.tokens=8192
# Safety cap: max tool call iterations per skill run (prevents infinite loops)
anthropic.max.tool.iterations=25
# Timeout for a single Claude API call (seconds)
anthropic.call.timeout.seconds=120

# ─────────────────────────────────────────────
# SerpAPI  ← web_search tool inside skills (salary data, company research)
# Get key: https://serpapi.com
# ─────────────────────────────────────────────
serpapi.api.key=
serpapi.monthly.limit=100

# ─────────────────────────────────────────────
# Gemini  ← still used for job matching scoring on delivery
# (Skills themselves now use Claude, not Gemini)
# ─────────────────────────────────────────────
gemini.api.key=YOUR_GEMINI_KEY
gemini.model=gemini-1.5-flash
gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# ─────────────────────────────────────────────
# Skill conversation settings
# ─────────────────────────────────────────────
# How long a paused conversation (ask_user) remains valid (minutes)
skill.conversation.expire.minutes=30

# ─────────────────────────────────────────────
# Skill prompt source (4-layer fallback chain)
# Layer 1: original plugin repo
# Layer 2: your fork (auto-synced daily)
# Layer 3: classpath bundled copies
# Layer 4: hardcoded minimal fallback
# ─────────────────────────────────────────────
skill.prompt.upstream.owner=andrew-shwetzer
skill.prompt.upstream.repo=career-ops-plugin
skill.prompt.fork.owner=YOUR_GITHUB_USERNAME
skill.prompt.fork.repo=career-ops-plugin
skill.prompt.github.branch=main

# ─────────────────────────────────────────────
# Job Sources
# ─────────────────────────────────────────────
adzuna.app.id=YOUR_ADZUNA_APP_ID
adzuna.app.key=YOUR_ADZUNA_APP_KEY
adzuna.daily.limit=250

reed.api.key=YOUR_REED_KEY

# ─────────────────────────────────────────────
# Email (Resend)
# ─────────────────────────────────────────────
resend.api.key=YOUR_RESEND_KEY
resend.from=CareerOps <noreply@careerops.local>

# ─────────────────────────────────────────────
# Business rules
# ─────────────────────────────────────────────
jobs.max.per.user.per.day=10
jobs.cron.daily.count=3
jobs.freshness.default.hours=96

# ─────────────────────────────────────────────
# Application
# ─────────────────────────────────────────────
app.base-url=https://YOUR-DOMAIN.com
cors.allowed.origins=http://localhost:4000

logging.level.com.careerops=INFO
