# ─── Application identity ───────────────────────────────────
spring.application.name=careerops-backend

# Repo-root .env when running `mvn spring-boot:run` from backend/ (gitignored)
spring.config.import=optional:file:../.env[.properties]

# AWS Secrets Manager — enabled only in prod (see application-prod.properties)
spring.cloud.aws.secretsmanager.enabled=false

# ─── Server ─────────────────────────────────────────────────
server.port=${PORT:8080}
server.servlet.context-path=/api

# ─── Database (PostgreSQL) ──────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/careerops}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.schema=careerops

# ─── HikariCP connection pool ───────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=careerops
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# ─── Flyway ─────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.schemas=careerops
spring.flyway.default-schema=careerops
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.repair-on-migrate=false
spring.flyway.placeholders.currency_default=EUR
spring.flyway.placeholders.environment=${SPRING_PROFILES_ACTIVE:dev}
# Required for CONCURRENTLY index creation in V83 (cannot run in a transaction)
spring.flyway.mixed=true

# ─── Spring Cache (Batch 4 – Caffeine, programmatic per-cache TTLs) ──────────
# CacheConfig.java registers individual Caffeine caches with distinct TTLs.
# type=caffeine keeps Spring Boot cache auto-config active so @Cacheable works.
# The CacheConfig bean overrides the default spec with per-cache registrations.
spring.cache.type=caffeine
# Cache names must match the constants in CacheConfig.java:
#   userStats      – 5 min  / 2 000 entries  (per-user dashboard counts)
#   sourceMetadata – 60 min / 500 entries    (job-source labels / icons)
#   companyInfo    – 60 min / 1 000 entries  (company logos / descriptions)
#   featureFlags   – 60 min / 200 entries    (feature flag lookups)
spring.cache.cache-names=userStats,sourceMetadata,companyInfo,featureFlags

# Dev tuning (logging, NVIDIA concurrency) + cache layer — secrets come from .env / env only
spring.profiles.include=dev,cache

# ─── Async Executors ────────────────────────────────────────
async.scraping.core-pool-size=8
async.scraping.max-pool-size=20
async.scraping.queue-capacity=100
async.scraping.thread-name-prefix=scraping-

async.ai.core-pool-size=4
async.ai.max-pool-size=10
async.ai.queue-capacity=50
async.ai.thread-name-prefix=ai-

# ─── Login word CAPTCHA (jumbled characters) ───────────────────
# Off in local dev; enable in prod/staging via profile or AUTH_LOGIN_WORD_CAPTCHA_REQUIRED=true
auth.login.word-captcha.required=${AUTH_LOGIN_WORD_CAPTCHA_REQUIRED:false}

# ─── CORS (frontend / middleware dev origins) ─────────────────
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4000,http://localhost:5173,http://localhost:5174,http://localhost:3000}

# ─── Stripe Billing ───────────────────────────────────────────
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
stripe.price-id.pro=${STRIPE_PRICE_ID_PRO:}
stripe.price-id.enterprise=${STRIPE_PRICE_ID_ENTERPRISE:}
stripe.checkout.success-url=${BILLING_SUCCESS_URL:}
stripe.checkout.cancel-url=${BILLING_CANCEL_URL:}
stripe.portal.return-url=${BILLING_PORTAL_RETURN_URL:}
stripe.mock-checkout-auto-activate=${STRIPE_MOCK_CHECKOUT_AUTO_ACTIVATE:false}

# ─── SaaS admin MRR (monthly list prices for metrics) ───────
saas.billing.price.free=0
saas.billing.price.pro=19
saas.billing.price.enterprise=299

# ─── Internal HMAC (middleware → backend) — set APP_INTERNAL_SECRET in .env ──
internal.trust.header=${INTERNAL_TRUST_HEADER:X-Internal-User-Id}
app.internal.secret=${APP_INTERNAL_SECRET:}
app.otp.pepper=${APP_OTP_PEPPER:local-dev-only-change-in-prod-32chars-min}

# ─── Local Postgres: no Redis required (rate limits in-memory) ──
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
ratelimit.require-shared-store=false

# ─── Supabase Storage (optional — CVs can use DB bytea when unset) ──
supabase.url=${SUPABASE_URL:}
supabase.service.key=${SUPABASE_SERVICE_KEY:}
supabase.bucket.cv=${SUPABASE_BUCKET_CV:user-cvs}
supabase.bucket.application.cv=${SUPABASE_BUCKET_APPLICATION_CV:application-cvs}
supabase.bucket.resume=${SUPABASE_BUCKET_RESUME:resume-versions}

# ─── AI providers (set keys in env for real calls) ───────────
# NVIDIA NIM — https://build.nvidia.com (env: NVIDIA_API_KEY)
onboarding.cv.ai-parse.enabled=${ONBOARDING_CV_AI_PARSE_ENABLED:true}
onboarding.cv.ai-parse.timeout.ms=${ONBOARDING_CV_AI_PARSE_TIMEOUT_MS:60000}
# Set false locally to test AI-only (no regex parse, no regex fallback on AI failure).
onboarding.cv.regex.enabled=${ONBOARDING_CV_REGEX_ENABLED:true}

nvidia.api.key=${NVIDIA_API_KEY:}
# Two-tier routing (NvidiaService): premium for writing, fast for structured tasks (CV parse, job-match, etc.)
nvidia.model.premium=${NVIDIA_MODEL_PREMIUM:nvidia/llama-3.3-nemotron-super-49b-v1}
nvidia.model.fast=${NVIDIA_MODEL_FAST:nvidia/nemotron-3-nano-30b-a3b}
# Legacy global override — leave empty; do NOT bind NVIDIA_AGENT_MODEL here (that forces Ultra on CV parse).
nvidia.model=${NVIDIA_LEGACY_MODEL:}
nvidia.agent.model=${NVIDIA_AGENT_MODEL:nvidia/nemotron-3-ultra-550b-a55b}
nvidia.fallback.model=${NVIDIA_FALLBACK_MODEL:meta/llama-3.1-70b-instruct}
nvidia.max.tokens=${NVIDIA_MAX_TOKENS:16384}
nvidia.reasoning.budget=${NVIDIA_REASONING_BUDGET:8192}
nvidia.temperature=${NVIDIA_TEMPERATURE:1}
nvidia.top_p=${NVIDIA_TOP_P:0.95}
nvidia.read.timeout.fast.ms=${NVIDIA_READ_TIMEOUT_FAST_MS:45000}
nvidia.read.timeout.premium.ms=${NVIDIA_READ_TIMEOUT_PREMIUM_MS:120000}
nvidia.read.timeout.ms=${NVIDIA_READ_TIMEOUT_MS:120000}
nvidia.connect.timeout.ms=${NVIDIA_CONNECT_TIMEOUT_MS:10000}
nvidia.agent.deadline.seconds=${NVIDIA_AGENT_DEADLINE_SECONDS:240}
nvidia.max.concurrent=${NVIDIA_MAX_CONCURRENT:5}
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
anthropic.max.tokens=${ANTHROPIC_MAX_TOKENS:8192}
gemini.api.key=${GEMINI_API_KEY:}
gemini.enabled=${GEMINI_ENABLED:false}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}
serpapi.api.key=${SERPAPI_API_KEY:}

# ─── Job sources (optional) ──────────────────────────────────
adzuna.app.id=${ADZUNA_APP_ID:}
adzuna.app.key=${ADZUNA_APP_KEY:}
adzuna.country.code=${ADZUNA_COUNTRY_CODE:gb}
reed.api.key=${REED_API_KEY:}
jobs.live.simulation.enabled=${JOBS_LIVE_SIMULATION:true}

# Job delivery: daily cap, manual/cron batch size, scrape age, fixed search location
jobs.daily.cap=25
jobs.batch.size=5
jobs.max.age.days=14
jobs.delivery.location=Ireland
jobs.onboarding.use-cached-pool=true
jobs.cached-pool.fetch-cap=500
# Deprecated alias — prefer jobs.daily.cap
jobs.max.per.user.per.day=25
# Deprecated — cron uses jobs.batch.size
jobs.cron.daily.count=5
# Run missed 06:00 Dublin fetch/score when JVM starts after sleep (dev default via application-dev.yml)
jobs.nightly.catchup-on-startup=${JOBS_NIGHTLY_CATCHUP_ON_STARTUP:false}

# ─── SMTP (JavaMailSender bean for legacy EmailService) ───────
spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:3025}

# ─── Email (Resend) — optional locally; dev-mode logs instead of sending ──
resend.api.key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:NewCareers <noreply@localhost>}
resend.dev-mode=${RESEND_DEV_MODE:false}

# ─── JWT (RS256 RSA key pair — set JWT_*_PEM in .env) ───────────────────────
jwt.private-key-pem=${JWT_PRIVATE_KEY_PEM:}
jwt.public-key-pem=${JWT_PUBLIC_KEY_PEM:}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.expiry.ms=${JWT_EXPIRY_MS:900000}
auth.refresh.remember.days=${AUTH_REFRESH_REMEMBER_DAYS:30}
auth.refresh.session.days=${AUTH_REFRESH_SESSION_DAYS:1}

# ─── AI / OpenAI ────────────────────────────────────────────
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_MODEL:gpt-4o-mini}
openai.api.max-tokens=4000
openai.api.temperature=0.7

# ─── Web scraping ───────────────────────────────────────────
web.scraping.enabled=${WEB_SCRAPING_ENABLED:true}
web.scraping.user-agent=Mozilla/5.0 (compatible; CareerOpsBot/1.0)
web.scraping.timeout-seconds=30

# ─── Job delivery ───────────────────────────────────────────
job.delivery.max-per-user-per-day=${JOB_DELIVERY_MAX:25}
job.delivery.min-match-percent=${JOB_DELIVERY_MIN_MATCH:60}

# ─── Company logo scraping ──────────────────────────────────
company.careers.playwright-timeout-seconds=45

# ─── Employment permit ingestion (enterprise.gov.ie) ─────────
spring.task.scheduling.enabled=true
permit.ingestion.enabled=${PERMIT_INGESTION_ENABLED:true}
permit.ingestion.python-executable=${PERMIT_PYTHON:python3}
permit.ingestion.script-path=${PERMIT_INGEST_SCRIPT:ingest_permit_stats.py}
permit.ingestion.xlsx-cache-dir=${PERMIT_XLSX_CACHE:}

# ─── Field encryption (per-user DEK + legacy global fallback) ─
# Master KEK wraps per-user DEKs in user_keys.encrypted_dek
app.master.kek=${APP_MASTER_KEK:}
# Legacy global key — lazy decrypt fallback for pre-migration ciphertext only
app.encryption.key=${APP_ENCRYPTION_KEY:}

# ─── App base URL ───────────────────────────────────────────
app.base-url=${APP_BASE_URL:http://localhost:4000}

# ─── SaaS billing ───────────────────────────────────────────
saas.billing.enforcement-enabled=${SAAS_BILLING_ENFORCEMENT_ENABLED:true}

# Per-email / per-user-id quota overrides (billing-free). Only listed accounts receive these limits.
careerops.quota-grants[0].email=yugandharreddybana@outlook.com
careerops.quota-grants[0].user-id=68da30b1-0bb0-4623-b6e2-ec9e248b15bf
careerops.quota-grants[0].unlimited-access=true

# ─── Actuator ───────────────────────────────────────────────
# 'caches' endpoint added (Batch 4) to expose Caffeine/Redis cache metrics.
management.endpoints.web.exposure.include=health,metrics,info,prometheus,loggers,caches
management.endpoint.health.show-details=when_authorized
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.75,0.95,0.99
