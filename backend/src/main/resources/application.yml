# CareerOps backend — base config (profile-neutral; no secrets)
spring:
  application:
    name: careerops-backend
  config:
    import: optional:file:../.env[.properties]
  cloud:
    aws:
      secretsmanager:
        enabled: false
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/careerops}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: careerops
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      leak-detection-threshold: 60000
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: careerops
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    schemas: careerops
    default-schema: careerops
    locations: classpath:db/migration
    baseline-on-migrate: false
    out-of-order: false
    repair-on-migrate: false
    mixed: true
    placeholders:
      currency_default: EUR
      environment: ${SPRING_PROFILES_ACTIVE:}
  cache:
    type: caffeine
    cache-names: userStats,sourceMetadata,companyInfo,featureFlags
  task:
    scheduling:
      enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:3025}

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

async:
  scraping:
    core-pool-size: 8
    max-pool-size: 20
    queue-capacity: 100
    thread-name-prefix: scraping-
  ai:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 50
    thread-name-prefix: ai-

auth:
  login:
    word-captcha:
      required: ${AUTH_LOGIN_WORD_CAPTCHA_REQUIRED:false}
  refresh:
    remember:
      days: ${AUTH_REFRESH_REMEMBER_DAYS:30}
    session:
      days: ${AUTH_REFRESH_SESSION_DAYS:1}

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4000,http://localhost:5173,http://localhost:5174,http://localhost:3000}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  price-id:
    pro: ${STRIPE_PRICE_ID_PRO:}
    enterprise: ${STRIPE_PRICE_ID_ENTERPRISE:}
  checkout:
    success-url: ${BILLING_SUCCESS_URL:}
    cancel-url: ${BILLING_CANCEL_URL:}
  portal:
    return-url: ${BILLING_PORTAL_RETURN_URL:}

saas:
  billing:
    price:
      free: 0
      pro: 19
      enterprise: 299

internal:
  trust:
    header: ${INTERNAL_TRUST_HEADER:X-Internal-User-Id}

app:
  internal:
    secret: ${APP_INTERNAL_SECRET:}
  otp:
    pepper: ${APP_OTP_PEPPER:local-dev-only-change-in-prod-32chars-min}
  master:
    kek: ${APP_MASTER_KEK:}
  encryption:
    key: ${APP_ENCRYPTION_KEY:}
  base-url: ${APP_BASE_URL:http://localhost:4000}

security:
  two-factor:
    rollout-enabled: ${TWO_FACTOR_ROLLOUT_ENABLED:false}

ratelimit:
  require-shared-store: false

captcha:
  secret: ${CAPTCHA_SECRET:}

supabase:
  url: ${SUPABASE_URL:}
  service:
    key: ${SUPABASE_SERVICE_KEY:}
  bucket:
    cv: ${SUPABASE_BUCKET_CV:user-cvs}
    application:
      cv: ${SUPABASE_BUCKET_APPLICATION_CV:application-cvs}
    resume: ${SUPABASE_BUCKET_RESUME:resume-versions}

nvidia:
  api:
    key: ${NVIDIA_API_KEY:}
  model: ${NVIDIA_AGENT_MODEL:meta/llama-3.3-70b-instruct}
  agent:
    model: ${NVIDIA_AGENT_MODEL:meta/llama-3.3-70b-instruct}
  fallback:
    model: ${NVIDIA_FALLBACK_MODEL:meta/llama-3.1-70b-instruct}
  max:
    concurrent: ${NVIDIA_MAX_CONCURRENT:5}

anthropic:
  api:
    key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
  max:
    tokens: ${ANTHROPIC_MAX_TOKENS:8192}

gemini:
  api:
    key: ${GEMINI_API_KEY:}
  enabled: ${GEMINI_ENABLED:false}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  endpoint: ${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}

serpapi:
  api:
    key: ${SERPAPI_API_KEY:}

adzuna:
  app:
    id: ${ADZUNA_APP_ID:}
    key: ${ADZUNA_APP_KEY:}
  country:
    code: ${ADZUNA_COUNTRY_CODE:gb}

reed:
  api:
    key: ${REED_API_KEY:}

jobs:
  live:
    simulation:
      enabled: ${JOBS_LIVE_SIMULATION:true}
  daily:
    cap: 25
  batch:
    size: 5
  max:
    age:
      days: 14
    per:
      user:
        per:
          day: 25
  delivery:
    location: Ireland
  cron:
    daily:
      count: 5
  onboarding:
    heuristic-fallback: false

resend:
  api:
    key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:NewCareers <noreply@localhost>}
  dev-mode: ${RESEND_DEV_MODE:false}

jwt:
  private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
  public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  expiration: ${JWT_EXPIRATION:86400000}
  expiry:
    ms: ${JWT_EXPIRY_MS:900000}

openai:
  api:
    key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    max-tokens: 4000
    temperature: 0.7

web:
  scraping:
    enabled: ${WEB_SCRAPING_ENABLED:true}
    user-agent: Mozilla/5.0 (compatible; CareerOpsBot/1.0)
    timeout-seconds: 30

scraper:
  auto-start: ${SCRAPER_AUTO_START:false}
  base-url: ${SCRAPER_BASE_URL:http://127.0.0.1:5500}
  startup-timeout-seconds: 90

job:
  delivery:
    max-per-user-per-day: ${JOB_DELIVERY_MAX:25}
    min-match-percent: ${JOB_DELIVERY_MIN_MATCH:60}

company:
  careers:
    playwright-timeout-seconds: 45

permit:
  ingestion:
    enabled: ${PERMIT_INGESTION_ENABLED:true}
    python-executable: ${PERMIT_PYTHON:python3}
    script-path: ${PERMIT_INGEST_SCRIPT:ingest_permit_stats.py}
    xlsx-cache-dir: ${PERMIT_XLSX_CACHE:}

skill:
  prompt:
    fork:
      owner: ${GITHUB_FORK_OWNER:yugandharreddybana}
      repo: ${GITHUB_FORK_REPO:career-ops-plugin}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus,loggers,caches
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
      percentiles:
        http:
          server:
            requests: 0.5,0.75,0.95,0.99

logging:
  level:
    com.careerops: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
