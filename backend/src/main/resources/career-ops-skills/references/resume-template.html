<!DOCTYPE html>
<html lang="{{DOC_LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{NAME}} - CV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    @page {
      size: A4;
      margin: 0.7in;
    }

    html, body {
      background: #ffffff;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10.5pt;
      line-height: 1.45;
      color: #111111;
      max-width: 210mm;
      margin: 0 auto;
      padding: 0.7in;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @media print {
      body {
        padding: 0;
        max-width: none;
      }

      .page-break {
        page-break-before: always;
      }
    }

    .cv-header {
      text-align: left;
      margin-bottom: 14pt;
      padding-bottom: 8pt;
      border-bottom: 1pt solid #222222;
    }

    .cv-header h1,
    .cv-name {
      font-size: 16pt;
      font-weight: 700;
      margin-bottom: 4pt;
      letter-spacing: 0.2pt;
    }

    .contact-line,
    .cv-role-line {
      font-size: 10.25pt;
      font-weight: 400;
      color: #222222;
      line-height: 1.4;
      margin-bottom: 4pt;
    }

    .header-preamble {
      margin-top: 4pt;
      font-size: 10pt;
      color: #333333;
      line-height: 1.45;
    }

    .header-preamble .contact-row,
    .header-preamble .links-row {
      margin-bottom: 2pt;
    }

    .header-preamble a {
      color: #1155cc;
      text-decoration: underline;
    }

    .section-content,
    .summary,
    .section-body,
    .experience-bullets li,
    .skill-line,
    .edu-entry {
      text-align: justify;
    }

    .section {
      margin-top: 12pt;
    }

    .section h2 {
      font-size: 11.5pt;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4pt;
      border-bottom: 0.75pt solid #cfcfcf;
      padding-bottom: 3pt;
      margin-bottom: 7pt;
      text-align: left;
    }

    .entry,
    .experience-entry {
      margin-bottom: 10pt;
    }

    .entry-header,
    .experience-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12pt;
      margin-bottom: 2pt;
    }

    .entry-title,
    .experience-title {
      font-size: 10.75pt;
      font-weight: 700;
      color: #111111;
    }

    .entry-dates,
    .experience-dates {
      font-size: 9.75pt;
      font-weight: 400;
      color: #444444;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .entry-subline,
    .experience-company {
      font-size: 10.25pt;
      font-weight: 700;
      color: #333333;
      margin-bottom: 4pt;
    }

    .experience-bullets,
    .entry ul {
      margin: 0;
      padding-left: 18pt;
      list-style-type: square;
    }

    .experience-bullets li,
    .entry li {
      font-size: 10.25pt;
      line-height: 1.4;
      margin-bottom: 2pt;
    }

    .skills-grid {
      font-size: 10.25pt;
      line-height: 1.5;
    }

    .skill-line,
    .skills-category {
      margin-bottom: 4pt;
    }

    .skills-category strong {
      font-weight: 700;
    }

    .education-entry,
    .edu-entry,
    .cert-entry,
    .project-entry {
      margin-bottom: 7pt;
      font-size: 10.25pt;
      line-height: 1.45;
    }

    .education-entry strong,
    .cert-entry strong,
    .project-entry strong,
    .degree {
      font-weight: 700;
      color: #111111;
    }

    .muted {
      color: #444444;
    }

    .plain-text-block {
      font-size: 10.25pt;
      line-height: 1.5;
      color: #222222;
    }
  </style>
</head>
<body>

  <header class="cv-header">
    <h1 class="cv-name">{{NAME}}</h1>
    <div class="contact-line cv-role-line">{{CONTACT_LINE}}</div>
    {{HEADER_PREAMBLE}}
  </header>

  {{SECTIONS_BODY}}

</body>
</html>
