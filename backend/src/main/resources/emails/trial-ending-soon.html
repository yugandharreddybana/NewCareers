<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Trial ending soon</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:480px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
          <tr>
            <td align="center" style="padding:28px 28px 12px;">
              <p style="margin:0;font-size:18px;font-weight:700;color:#2563eb;">CareerOps</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 8px;">
              <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">Hi {{firstName}},</p>
              <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#334155;">
                Your Pro trial ends <strong>tomorrow</strong> ({{trialEndsAt}}). Upgrade now to keep Pro limits and uninterrupted access.
              </p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:8px 28px 28px;">
              <a href="{{upgradeUrl}}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:14px 28px;border-radius:8px;">Upgrade to Pro</a>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;border-radius:0 0 12px 12px;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;">&copy; CareerOps. Dublin, Ireland.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
