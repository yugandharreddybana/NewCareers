# Test profile — H2 in-memory DB so integration tests run without Postgres/Redis

spring.datasource.url=jdbc:h2:mem:careerops_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=KEY,VALUE;INIT=RUNSCRIPT FROM 'classpath:h2-init.sql'

spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.hikari.schema=PUBLIC

spring.datasource.username=sa

spring.datasource.password=

cors.allowed.origins=http://localhost:4000,http://localhost:5173,http://localhost:5174,http://localhost:3000

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.default_schema=careerops

spring.jpa.defer-datasource-initialization=true

spring.sql.init.schema-locations=classpath:h2-postgresql-compat.sql

spring.sql.init.data-locations=classpath:h2-dev-seed.sql

spring.sql.init.mode=always

spring.flyway.enabled=false



# Disable Gemini real calls in tests — override with mock in @SpringBootTest

gemini.api.key=test-key-placeholder

gemini.enabled=false

onboarding.cv.ai-parse.enabled=false



# JWT keys for RS256 tests

jwt.private-

jwt.public-

jwt.expiry.ms=900000

app.internal.secret=test-internal-trust-secret-minimum-32-characters-long
app.otp.pepper=test-otp-pepper-for-unit-tests-32-bytes-min
jwt.private-key-pem=${jwt.private-key}
jwt.public-key-pem=${jwt.public-key}

# Fixed 32-byte test key (do not use in production)
app.master.kek=BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
app.encryption.key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Disable mail in tests

spring.mail.host=localhost

spring.mail.port=3025
resend.dev-mode=true

server.port=8100



spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

ratelimit.require-shared-store=false

# Do not spawn Python scraper during @SpringBootTest
scraper.auto-start=false
scraper.base-url=
