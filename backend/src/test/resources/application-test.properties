# Test profile — use H2 in-memory DB so integration tests run without Mongo/Postgres
spring.datasource.url=jdbc:h2:mem:careerops_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Disable Gemini real calls in tests — override with mock in @SpringBootTest
gemini.api.key=test-key-placeholder
gemini.enabled=false

# JWT secrets (short for tests)
jwt.secret=test-jwt-secret-key-minimum-256-bits-long-1234567890
jwt.access-token-expiry=3600000
jwt.refresh-token-expiry=86400000

# Disable mail in tests
spring.mail.host=localhost
spring.mail.port=3025
