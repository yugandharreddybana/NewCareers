# Production override — no dev bind-mounts, restart always, resource limits.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile full up -d

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  middleware:
    image: node:20-alpine
    profiles: ["full"]
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm start"]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MIDDLEWARE_PORT:-4000}:4000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      JAVA_BACKEND_URL: http://backend:8080
      ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.careerops.com}
    volumes:
      - ./middleware:/app
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  backend:
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SCRAPER_AUTO_START: "false"
      PERMIT_INGESTION_ENABLED: "false"
    volumes: []
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  scraper:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
